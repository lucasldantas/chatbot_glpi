services:
  # ─── Banco de dados compartilhado ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: glpi-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (sessões do bot + cache Evolution API + Chatwoot) ────────────────
  redis:
    image: redis:7-alpine
    container_name: glpi-bot-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Evolution API 2.3.7 (build local a partir do fonte baixado pelo install.sh)
  evolution-api:
    build:
      context: ./evolution-api-src
      dockerfile: Dockerfile
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # Banco
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolutiondb
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # Cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD_ENCODED}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Auth
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Webhook global → nosso bot
      WEBHOOK_GLOBAL_URL: http://bot:3000/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # Config geral
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - bot-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Chatwoot ────────────────────────────────────────────────────────────────
  chatwoot-web:
    build:
      context: ./chatwoot
      dockerfile: Dockerfile
    image: chatbot-chatwoot:local
    container_name: chatwoot-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_DB: chatwoot_production
      REDIS_URL: redis://:${REDIS_PASSWORD_ENCODED}@redis:6379/2
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      DEFAULT_LOCALE: pt_BR
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "false"
      RAILS_ENV: production
      NODE_ENV: production
      BUNDLE_PATH: /gems
      GEM_HOME: /gems
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - bot-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot-worker:
    image: chatbot-chatwoot:local
    container_name: chatwoot-worker
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_DB: chatwoot_production
      REDIS_URL: redis://:${REDIS_PASSWORD_ENCODED}@redis:6379/2
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      RAILS_ENV: production
      NODE_ENV: production
      BUNDLE_PATH: /gems
      GEM_HOME: /gems
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - bot-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Bot (nosso serviço Node.js) ────────────────────────────────────────────
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: glpi-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD_ENCODED}@redis:6379/0
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}

      # Evolution API
      EVOLUTION_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}

      # GLPI
      GLPI_URL: ${GLPI_URL}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN}
      GLPI_DEFAULT_CATEGORY_ID: ${GLPI_DEFAULT_CATEGORY_ID:-0}
      GLPI_ONBOARDING_CATEGORY_ID: ${GLPI_ONBOARDING_CATEGORY_ID:-0}

      # Chatwoot DB — apenas para submeter CSAT ao relatório nativo
      CHATWOOT_DB_HOST: postgres
      CHATWOOT_DB_USER: chatwoot
      CHATWOOT_DB_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      CHATWOOT_DB_NAME: chatwoot_production

      # ChatWoot
      CHATWOOT_URL: http://chatwoot-web:3000
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET}

      # Claude / Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: claude-sonnet-4-6

      # CSAT
      CSAT_SCALE: 5
    networks:
      - bot-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  evolution_data:
  chatwoot_storage:

networks:
  bot-network:
    driver: bridge
